<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUSY Web OS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div id="logo-svg"></div>
      <span class="logo-sub">WEB OS</span>
    </div>
    <nav>
      <a href="#/widgets" data-nav="widgets">Widgets</a>
      <a href="#/notifications" data-nav="notifications">Notifications</a>
      <a href="#/api" data-nav="api">API</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="device-panel">
      <div id="preview-wrap" class="preview-wrap hidden">
        <div class="bar-frame">
          <div class="bar-screen"><img id="screen-preview" alt="" /></div>
        </div>
        <button id="preview-expand" class="expand-btn" title="Full screen">⛶</button>
      </div>
      <div id="device-status" class="device-status">
        <span class="dot offline"></span> Device offline
      </div>
    </div>
  </aside>
  <main id="app"></main>
  <div id="preview-overlay" class="preview-overlay hidden">
    <div class="bar-frame overlay-frame">
      <div class="bar-screen"><img id="screen-preview-full" alt="" /></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
